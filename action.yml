name: Major Tag Action
description: Automatically update major version tag (e.g., v1) to point to the latest semver release tag
author: somaz94

branding:
  icon: tag
  color: blue

inputs:
  tag:
    description: 'The full semver tag to extract major version from (e.g., v1.2.3)'
    required: true
  github_token:
    description: 'GitHub token for pushing tags'
    required: false
    default: ${{ github.token }}
  ssh_key:
    description: 'SSH private key for pushing tags (alternative to github_token)'
    required: false
    default: ''
  major_only:
    description: 'Only update major version tag (e.g., v1). Set to false to also update minor tag (e.g., v1.2)'
    required: false
    default: 'true'

outputs:
  major_tag:
    description: 'The major version tag that was updated (e.g., v1)'
  minor_tag:
    description: 'The minor version tag that was updated (e.g., v1.2), empty if major_only is true'
  commit_sha:
    description: 'The commit SHA the tags point to'

runs:
  using: docker
  # A prebuilt image rather than `Dockerfile`. With `Dockerfile`, every consumer
  # workflow compiles Go and builds an alpine image before the action can start
  # — measured at 31s per run on a sibling action. Pulling costs a few seconds.
  #
  # The Dockerfile is still the source this image is built from, and ci.yml
  # keeps building it on every pull request, so the build path cannot silently
  # rot.
  #
  # Two things this trades away, both deliberate:
  #   1. The tag must not be pushed before the image exists. `release.yml`
  #      publishes the image in a job the release job depends on, and the very
  #      first version is seeded by hand (see that file's workflow_dispatch).
  #   2. `Dockerfile` built for whatever architecture the runner was; a
  #      registry reference resolves only to what was pushed. The image is
  #      published linux/amd64 + linux/arm64 so arm64 runners keep working.
  image: docker://ghcr.io/somaz94/major-tag-action:v1.1.1
  env:
    INPUT_TAG: ${{ inputs.tag }}
    INPUT_GITHUB_TOKEN: ${{ inputs.github_token }}
    INPUT_SSH_KEY: ${{ inputs.ssh_key }}
    INPUT_MAJOR_ONLY: ${{ inputs.major_only }}
